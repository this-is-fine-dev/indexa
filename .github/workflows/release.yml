name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release.py
      - name: Validate release settings
        if: env.ALREADY_RELEASED != 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]{1,3}\.[0-9]{1,2}\.[0-9]{1,2}$ ]]
          test -n "$SPARKLE_PRIVATE_KEY"
          echo "INDEXA_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Cache native build dependencies
        if: env.ALREADY_RELEASED != 'true'
        uses: actions/cache@v4
        with:
          # Only compiler/dependency outputs; signing keys are never cached.
          path: |
            .build
            matrix/qr/target
            ~/.cargo/registry
            ~/.cargo/git
          key: native-${{ runner.os }}-${{ runner.arch }}-xcode26.3-${{ hashFiles('Package.resolved', 'matrix/qr/Cargo.lock') }}
      - name: Check Swift toolchain and locked dependencies
        if: env.ALREADY_RELEASED != 'true'
        run: |
          xcodebuild -version
          swift --version
          swift package --disable-keychain --force-resolved-versions resolve
      - name: Prepare stable code signing without Keychain
        if: env.ALREADY_RELEASED != 'true'
        env:
          INDEXA_CODE_SIGNING_KEY: ${{ secrets.INDEXA_CODE_SIGNING_KEY }}
        run: |
          test -n "$INDEXA_CODE_SIGNING_KEY"
          umask 077
          mkdir -p .signing
          printf '%s' "$INDEXA_CODE_SIGNING_KEY" > .signing/key.pem
          python3 scripts/prepare-codesign.py
          python3 Tests/test_signing.py
      - name: Build native QR helper
        if: env.ALREADY_RELEASED != 'true'
        run: cargo build --release --locked --manifest-path matrix/qr/Cargo.toml
      - uses: actions/setup-python@v5
        if: env.ALREADY_RELEASED != 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: matrix/requirements.txt
      - name: Install offline test dependencies
        if: env.ALREADY_RELEASED != 'true'
        run: python3 -m pip install -r matrix/requirements.txt
      - name: Test Swift and Python
        if: env.ALREADY_RELEASED != 'true'
        run: |
          bash scripts/test-local.sh
          python3 -B Tests/test_notes.py
          python3 -B Tests/test_release_guard.py
          python3 -B Tests/test_hermes_mcp.py
          python3 -B Tests/test_runtime_update.py
          python3 -B Tests/test_matrix_journal.py
          python3 -B Tests/test_matrix_media.py
          python3 -B Tests/test_matrix_qr_boundaries.py
          python3 -B Tests/test_bot_identity.py
          python3 -B Tests/test_matrix_crypto.py
          python3 -B Tests/test_matrix_setup.py
      - name: Package app
        if: env.ALREADY_RELEASED != 'true'
        run: bash scripts/build-app.sh
      - name: Sign appcast
        if: env.ALREADY_RELEASED != 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          mkdir -p dist/update
          cp "dist/Indexa-$INDEXA_VERSION.zip" dist/update/
          if [[ -f "release-notes/$INDEXA_VERSION.md" ]]; then
            cp "release-notes/$INDEXA_VERSION.md" "dist/update/Indexa-$INDEXA_VERSION.md"
          else
            previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)
            git log --pretty='- %s' "${previous:+$previous..}$GITHUB_REF_NAME" > "dist/update/Indexa-$INDEXA_VERSION.md"
          fi
          printf '%s' "$SPARKLE_PRIVATE_KEY" | .build/artifacts/sparkle/Sparkle/bin/generate_appcast \
            --ed-key-file - --embed-release-notes \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/" \
            -o dist/update/appcast.xml dist/update
      - name: Verify signed archive
        if: env.ALREADY_RELEASED != 'true'
        run: python3 -B Tests/test_release_package.py dist/update/appcast.xml
      - name: Recheck publication state after build
        if: env.ALREADY_RELEASED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release.py
      - name: Publish release
        if: env.ALREADY_RELEASED != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            "dist/Indexa-$INDEXA_VERSION.zip" dist/update/appcast.xml \
            --latest="$INDEXA_MAKE_LATEST" --title "Indexa $INDEXA_VERSION" --notes-file "dist/update/Indexa-$INDEXA_VERSION.md"
      - name: Remove build signing key
        if: always()
        run: rm -f .signing/key.pem
